services:
  - type: web
    name: 0xlynk
    runtime: node
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: npm ci
    startCommand: npm run start:signaling:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SESSION_TTL_MS
        value: 10800000
      - key: CLEANUP_INTERVAL_MS
        value: 15000
      - key: RECONNECT_GRACE_MS
        value: 30000
      - key: MAX_JOIN_ATTEMPTS_PER_MINUTE
        value: 30
      - key: MAX_PASSPHRASE_LENGTH
        value: 128
      - key: MAX_JOIN_AUTH_USERNAME_LENGTH
        value: 64
      - key: MAX_JOIN_AUTH_PASSWORD_LENGTH
        value: 128
      - key: MAX_SIGNAL_MESSAGE_BYTES
        value: 65536
      - key: ICE_SERVERS_JSON
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
